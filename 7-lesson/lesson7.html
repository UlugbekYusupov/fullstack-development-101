<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet", href="lesson7.css">
</head>
<body>
    <div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button class="org" onclick="clearDisplay()">C</button>
        <button class="org" onclick="deleteLast()">DEL</button>
        <button class="org" onclick="appendToDisplay('%')">%</button>
        <button class="org" onclick="appendToDisplay('/')">/</button>
        <button class="wht" onclick="appendToDisplay('7')">7</button>
        <button class="wht" onclick="appendToDisplay('8')">8</button>
        <button class="wht" onclick="appendToDisplay('9')">9</button>
        <button class="org" onclick="appendToDisplay('*')">x</button>
        
        <button class="wht" onclick="appendToDisplay('4')">4</button>
        <button class="wht" onclick="appendToDisplay('5')">5</button>
        <button class="wht" onclick="appendToDisplay('6')">6</button>
        <button class="org" onclick="appendToDisplay('-')">-</button>
        
        <button class="wht" onclick="appendToDisplay('1')">1</button>
        <button class="wht" onclick="appendToDisplay('2')">2</button>
        <button class="wht" onclick="appendToDisplay('3')">3</button>
        <button class="org" onclick="appendToDisplay('+')">+</button>
        
        <button class="wht" onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
        <button class="wht" onclick="appendToDisplay('.')">.</button>
        <button class="gre" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="lesson7.js" defer></script>
</body>
</html>
