<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="coantainer">
        <div class="calculator_conatainer">
            <input type="text" id="resultInput">
            <div class="numbersContainer">
                <button id="clearBtn">C</button>
                <button id="delBtn">DEL</button>
                <button id="percentBtn">%</button>
                <button id="devisionBtn">/</button>
            
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button id="multiplyBtn">*</button>
            
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button id="subtractBtn">-</button>
            
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button id="addBtn">+</button>

                <button class="zero">0</button>
                <button id="dot">.</button>
                <button id="resultBtn">=</button>
            </div>
        </div>
    </div>

   <script src="calculator.js"></script> 
</body>
</html>
