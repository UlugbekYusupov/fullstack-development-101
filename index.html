<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width initial-scale=1.0" />
  <link rel="stylesheet" href="" />
  <title>Document</title>
  <script defer src="app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    table,
    th,
    td {
      border: 1px solid rgb(184, 184, 184);
    }

    body {
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .card-section {
      width: 500px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e0e0e0;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    h1 {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 28px;
      color: #111;
    }

    .field {
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    input::placeholder {
      color: #aaa;
    }

    input:focus {
      border-color: #2483f5;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #2483f5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;

      a {
        color: white;
        text-decoration: none;
      }
    }

    .btn-primary:hover {
      background: #1a6edc;
    }

    .btn-outline {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: #2483f5;
      border: 2px solid #2483f5;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, color 0.2s;
    }

    .btn-outline:hover {
      background: #e8f1fd;
    }

    .link-text {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #2483f5;
      cursor: pointer;
      text-decoration: none;
    }

    .link-text:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    /* Team */
    .layout {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 1100px;
      margin: 40px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .card {
      min-width: 500px;

      background: #fff;
      border-radius: 16px;
      border: 1px solid #e0e0e0;
      padding: 32px 28px;
    }

    .board-card {
      flex: 1;
    }

    h2 {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #111;
    }

    .field {
      margin-bottom: 12px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    input::placeholder {
      color: #aaa;
    }

    input:focus {
      border-color: #2483f5;
    }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #2483f5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #1a6edc;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: #2483f5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #1a6edc;
    }

    .error {
      color: #e03131;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      min-height: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    thead tr {
      background: #2483f5;
      color: #fff;
    }

    thead th {
      padding: 10px 12px;
      font-weight: 600;
      text-align: center;

    }

    tbody tr:nth-child(even) {
      background: #f4f6f9;
    }

    tbody tr {
      transition: background 0.2s;
    }

    tbody tr.highlighted {
      background: #fff3cd !important;
    }

    tbody td {
      padding: 10px 12px;
      text-align: center;
      color: #333;
    }

    .btn-del {
      background: none;
      border: none;
      cursor: pointer;
      color: #e03131;
      font-size: 15px;
      padding: 0 4px;
    }

    .btn-del:hover {
      opacity: 0.7;
    }

    .empty {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <!-- Lecture 8 Part 3 Start -->
  <div id="parent" style="width: 400px; padding:40px; background: lightblue;">
    PARENT
    <div id="child" style="padding:40px; background: lightgreen;">
      CHILD
      <button id="btn">CLICK ME</button>
    </div>
  </div>
  <div class="card-section">
    <div class="card">

      <!-- Sign Up Form -->
      <div id="signup-form">
        <h1>Sign Up</h1>
        <div class="field">
          <input type="text" id="su-username" placeholder="Username" />
        </div>
        <div class="field">
          <input type="email" id="su-email" placeholder="Email" />
        </div>
        <div class="field">
          <input type="password" id="su-password" placeholder="Password" />
        </div>
        <button class="btn-primary" onclick="handleSignUp()">Submit</button>
        <p class="link-text" onclick="showLogin()">Already have an account? Login</p>
      </div>

      <!-- Login Form -->
      <div id="login-form" class="hidden">
        <h1>Login</h1>
        <div class="field">
          <input type="email" id="li-email" placeholder="Email" />
        </div>
        <div class="field">
          <input type="password" id="li-password" placeholder="Password" />
        </div>
        <button class="btn-primary" onclick="handleLogin()">Submit</button>
        <button class="btn-outline" onclick="showSignUp()">Don't have an account? Sign Up</button>
      </div>

      <!-- Welcome screen (already logged in) -->
      <div id="welcome-screen" class="hidden" style="text-align:center; padding: 20px 0;">
        <div style="font-size: 56px; margin-bottom: 16px;">👋</div>
        <h1 style="font-size: 22px; margin-bottom: 8px;">Привет, <span id="welcome-name"></span>!</h1>
        <p style="color: #666; font-size: 15px; margin-bottom: 24px;">Ты уже вошёл в систему.</p>
        <button class="btn-primary" style="margin-bottom: 10px;"><a href="https:www.mirzoulugbek.com/">Перейти на сайт
            →</a></button>


        <button class="btn-outline" onclick="logout()">Выйти из аккаунта</button>
      </div>

      <!-- Unknown user screen -->
      <div id="unknown-screen" class="hidden" style="text-align:center; padding: 20px 0;">
        <div style="font-size: 64px; margin-bottom: 16px;">🕵️</div>
        <h1 style="font-size: 22px; margin-bottom: 12px;">Кто ты такой?</h1>
        <p style="color: #666; font-size: 15px; margin-bottom: 24px;">Мы тебя не знаем.<br>Сначала зарегистрируйся!</p>
        <button class="btn-primary" onclick="tryAgain()" style="margin-bottom: 10px;">Попробовать снова</button>
        <button class="btn-outline" onclick="showSignUp()">Зарегистрироваться</button>
      </div>

    </div>
  </div>
  <div class="layout">

    <!-- ADD TEAM FORM -->
    <div class="card add-card">
      <h2>🏆 Add New Team</h2>
      <div class="field"><input type="text" id="f-name" placeholder="Team Name" /></div>
      <div class="field"><input type="number" id="f-wins" placeholder="Wins" min="0" /></div>
      <div class="field"><input type="number" id="f-losses" placeholder="Losses" min="0" /></div>
      <div class="field"><input type="number" id="f-scored" placeholder="Goals Scored" min="0" /></div>
      <div class="field"><input type="number" id="f-conceded" placeholder="Goals Conceded" min="0" /></div>
      <button class="btn-primary" onclick="addTeam()">Add Team</button>
      <div class="error" id="err-msg"></div>
    </div>

    <!-- LEADERBOARD -->
    <div class="card board-card">
      <h2>🏆 Sports Tournament Leaderboard</h2>
      <button class="btn-secondary" onclick="sortByRanking()">Sort by Ranking</button>
      <button class="btn-secondary" onclick="highlightBest()">Highlight Best Team</button>

      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Wins</th>
            <th>Losses</th>
            <th>Points</th>
            <th>Goal Diff</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="team-tbody"></tbody>
      </table>
      <div class="empty" id="empty-msg">No teams yet. Add one!</div>
    </div>

  </div>

  <script>
    // On page load: check if a user is already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const loggedIn = localStorage.getItem('auth_user')
      if (loggedIn) {
        const user = JSON.parse(loggedIn)
        document.getElementById('signup-form').classList.add('hidden')
        document.getElementById('welcome-screen').classList.remove('hidden')
        document.getElementById('welcome-name').textContent = user.username
      }
    })
    function logout() {
      localStorage.removeItem('auth_user')
      document.getElementById('welcome-screen').classList.add('hidden')
      document.getElementById('login-form').classList.remove('hidden')
    }

    function showLogin() {
      document.getElementById('signup-form').classList.add('hidden')
      document.getElementById('login-form').classList.remove('hidden')
    }

    function showSignUp() {
      document.getElementById('login-form').classList.add('hidden')
      document.getElementById('unknown-screen').classList.add('hidden')
      document.getElementById('signup-form').classList.remove('hidden')
    }

    function handleSignUp() {
      const username = document.getElementById('su-username').value.trim()
      const email = document.getElementById('su-email').value.trim()
      const password = document.getElementById('su-password').value.trim()

      if (!username || !email || !password) {
        alert('Please fill in all fields.')
        return
      }

      const existing = JSON.parse(localStorage.getItem('users') || '[]')
      const alreadyExists = existing.find(u => u.email === email)
      if (alreadyExists) {
        alert('User with this email already exists. Please login.')
        showLogin()
        return
      }

      existing.push({ username, email, password })
      localStorage.setItem('users', JSON.stringify(existing))

      alert(`Account created for ${username}! Please login.`)
      showLogin()
    }

    function handleLogin() {
      const email = document.getElementById('li-email').value.trim()
      const password = document.getElementById('li-password').value.trim()

      if (!email || !password) {
        alert('Please fill in all fields.')
        return
      }

      const users = JSON.parse(localStorage.getItem('users') || '[]')
      const user = users.find(u => u.email === email && u.password === password)

      if (!user) {
        document.getElementById('login-form').classList.add('hidden')
        document.getElementById('unknown-screen').classList.remove('hidden')
        return
      }

      localStorage.setItem('auth_user', JSON.stringify(user))
      document.getElementById('login-form').classList.add('hidden')
      document.getElementById('welcome-screen').classList.remove('hidden')
      document.getElementById('welcome-name').textContent = user.username
    }

    function tryAgain() {
      document.getElementById('unknown-screen').classList.add('hidden')
      document.getElementById('login-form').classList.remove('hidden')
    }
    let teams = JSON.parse(localStorage.getItem('teams') || '[]')
    let highlightedIndex = -1

    function save() {
      localStorage.setItem('teams', JSON.stringify(teams))
    }

    function render() {
      const tbody = document.getElementById('team-tbody')
      const emptyMsg = document.getElementById('empty-msg')
      tbody.innerHTML = ''

      if (teams.length === 0) {
        emptyMsg.style.display = 'block'
        return
      }
      emptyMsg.style.display = 'none'

      teams.forEach((team, i) => {
        const tr = document.createElement('tr')
        if (i === highlightedIndex) tr.classList.add('highlighted')
        tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${team.name}</td>
        <td>${team.wins}</td>
        <td>${team.losses}</td>
        <td>${team.points}</td>
        <td>${team.goalDiff}</td>
        <td><button class="btn-del" onclick="deleteTeam(${i})">✕</button></td>
      `
        tbody.appendChild(tr)
      })
    }

    function addTeam() {
      const name = document.getElementById('f-name').value.trim()
      const wins = parseInt(document.getElementById('f-wins').value)
      const losses = parseInt(document.getElementById('f-losses').value)
      const scored = parseInt(document.getElementById('f-scored').value)
      const conceded = parseInt(document.getElementById('f-conceded').value)
      const errEl = document.getElementById('err-msg')

      if (!name || isNaN(wins) || isNaN(losses) || isNaN(scored) || isNaN(conceded)) {
        errEl.textContent = 'Please fill in all fields correctly.'
        return
      }
      if (teams.find(t => t.name.toLowerCase() === name.toLowerCase())) {
        errEl.textContent = 'A team with this name already exists.'
        return
      }
      errEl.textContent = ''

      teams.push({
        name,
        wins,
        losses,
        points: wins * 3,
        goalDiff: scored - conceded
      })

      save()
      highlightedIndex = -1
      render()

        ;['f-name', 'f-wins', 'f-losses', 'f-scored', 'f-conceded'].forEach(id => {
          document.getElementById(id).value = ''
        })
    }

    function deleteTeam(index) {
      teams.splice(index, 1)
      highlightedIndex = -1
      save()
      render()
    }

    function sortByRanking() {
      teams.sort((a, b) => b.points - a.points || b.goalDiff - a.goalDiff)
      highlightedIndex = -1
      save()
      render()
    }

    function highlightBest() {
      if (teams.length === 0) return
      const maxPoints = Math.max(...teams.map(t => t.points))
      highlightedIndex = teams.findIndex(t => t.points === maxPoints)
      render()
    }

    render() 
  </script>
</body>

</html>
