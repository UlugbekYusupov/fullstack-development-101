<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
  }

  .container {
    width: 400px;
    margin: 50px auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
  }

  h2 {
    text-align: center;
  }

  .task {
    background: #f9f9f9;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    position: relative;
  }

  .status {
    position: absolute;
    right: 10px;
    top: 10px;
    padding: 3px 8px;
    border-radius: 5px;
    color: #fff;
    font-size: 12px;
  }

  .pending { background: orange; }
  .progress { background: blue; }
  .done { background: green; }

  button {
    padding: 5px 10px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
  }

  .delete {
    background: red;
    color: #fff;
    margin-top: 5px;
  }

  .add-btn {
    width: 100%;
    background: #007bff;
    color: #fff;
    margin-top: 10px;
  }

  .modal {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
  }

  .modal-content {
    background:#fff;
    padding:20px;
    border-radius:10px;
    width:300px;
  }

  input, textarea, select {
    width:100%;
    margin-bottom:10px;
    padding:5px;
  }

</style>
</head>
<body>

<div class="container">
  <h2>To-Do List</h2>

  <div id="tasks"></div>

  <button class="add-btn" onclick="openModal()">Add Task</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Add Task</h3>
    <input id="title" placeholder="Task title">
    <textarea id="desc" placeholder="Description"></textarea>
    <select id="status">
      <option value="pending">Pending</option>
      <option value="progress">In Progress</option>
      <option value="done">Completed</option>
    </select>
    <button onclick="addTask()">Save</button>
    <button onclick="closeModal()" style="background:red;color:#fff;">Close</button>
  </div>
</div>


<script src="app.js"></script>
</body>
</html>
